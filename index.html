<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>SVG Clipboard Injector</title>
    
    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>SVG Vector Injector</h2>
        <p>Copy raw SVG code to your clipboard, then click below to drop it onto your active slide as a true vector shape.</p>
        
        <button id="insertSvgButton">Insert SVG from Clipboard</button>
        <div id="statusMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
